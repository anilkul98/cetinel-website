name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "23.5.0"

      - name: Install dependencies
        run: npm install

      - name: Build the app
        env:
          VITE_API_KEY: ${{ secrets.VITE_GMAP_API_KEY }}
        run: npm run build
        
      - name: Check Env Variable
        run: echo ${{ secrets.VITE_GMAP_API_KEY }}

      # Set up Git
      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.CETINELLER_WEB }}
          publish_dir: ./dist
